services:
  yepsua-pg16-db:
    image: postgres:16
    container_name: yepsua-pg16-db
    restart: "no"
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-yepsua-db}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - yepsua-pg16-db:/var/lib/postgresql/data
    networks:
      - sail
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-yepsua-db}", "-U", "${DB_USER:-postgres}"]
      retries: 3
      timeout: 5s

networks:
  sail:
    external: true
    name: yepsua-network

volumes:
  yepsua-pg16-db:
    name: yepsua-pg16-db
    external: true
