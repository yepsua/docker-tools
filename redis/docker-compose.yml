services:
  yepsua-redis:
    image: redis:alpine
    container_name: yepsua-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - yepsua-redis:/data
    networks:
      - sail

networks:
  sail:
    external: true
    name: yepsua-network

volumes:
  yepsua-redis:
    name: yepsua-redis
